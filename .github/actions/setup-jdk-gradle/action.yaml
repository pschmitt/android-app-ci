name: Setup JDK and Gradle
description: >-
  Installs the pinned Temurin JDK used by every app in the fleet and sets up the Gradle
  build-cache/action. Assumes the repository is already checked out.

inputs:
  java-version:
    description: Temurin JDK version to install
    default: '21.0.11'

runs:
  using: composite
  steps:
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
