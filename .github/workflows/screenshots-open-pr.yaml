name: Reusable / Open screenshots PR

# Shared tail end of every app's Screenshots workflow: download the phone/sevenInch/tenInch
# screenshot artifacts a caller's own `capture` job produced (fixture setup differs too much per
# app - NetBox/Jellyfin/Mealie/none - to centralize that job itself), flatten them into
# fastlane's metadata layout, and open or update a single stable PR with an inline image gallery.
# A stable branch name (not keyed by run_id) plus a force-push means repeated dispatches update
# the same PR in place instead of piling up a new one per run.
#
# Caller contract: its `capture` job must upload three artifacts named
# "<artifact-label>-phone-screenshots-${{ github.run_id }}", "...-sevenInch-...", and
# "...-tenInch-...", each containing (among other things) the corresponding
# fastlane/metadata/android/en-US/images/<type>Screenshots/*.png files.

on:
  workflow_call:
    inputs:
      artifact-label:
        description: Must match the prefix the caller's capture job uploaded screenshot artifacts under
        type: string
        required: true
      commit-message:
        type: string
        default: "chore: update Play Store screenshots (phone, 7in, 10in tablet)"
      sync-readme:
        description: Run an extra step copying selected phone-bucket screenshots into README image paths
        type: boolean
        default: false
      readme-images:
        description: >-
          Only used when sync-readme is true. One entry per line, "<phone-screenshot-filename-prefix>|<destination-path>|<match-suffix-glob>",
          e.g. "01_dashboard|docs/images/readme-dashboard.png|_light_[0-9]*.png".
        type: string
        default: ''
      pr-body-intro:
        description: Extra sentence appended to the "opened a new PR" body, e.g. mentioning that merging it also refreshes the README gallery
        type: string
        default: ''

permissions:
  contents: read

jobs:
  open-pr:
    name: Open PR with updated screenshots
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download phone screenshots
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-label }}-phone-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/phoneScreenshots

      - name: Download sevenInch screenshots
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-label }}-sevenInch-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/sevenInchScreenshots

      - name: Download tenInch screenshots
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-label }}-tenInch-screenshots-${{ github.run_id }}
          path: fastlane/metadata/android/en-US/images/tenInchScreenshots

      # Each device-type artifact was uploaded alongside other paths (androidTest reports,
      # failure screenshots, ...), so it unpacks with the actual .pngs nested some levels deep
      # rather than directly in the download path. Find them regardless of exact depth and drop
      # everything else before committing.
      - name: Flatten downloaded artifacts to just the screenshots
        run: |
          for device_type in phone sevenInch tenInch; do
            dir="fastlane/metadata/android/en-US/images/${device_type}Screenshots"
            find "$dir" -mindepth 2 -iname '*.png' -exec mv {} "$dir/" \;
            find "$dir" -mindepth 1 -type d -exec rm -rf {} +
          done

      - name: Sync README screenshots from the phone bucket
        if: inputs.sync-readme
        env:
          README_IMAGES: ${{ inputs.readme-images }}
        run: |
          src="fastlane/metadata/android/en-US/images/phoneScreenshots"
          while IFS='|' read -r prefix dest suffix; do
            [ -n "$prefix" ] || continue
            match="$(find "$src" -iname "${prefix}${suffix}" | head -n1)"
            test -n "$match" || { echo "No capture found for $prefix (pattern ${prefix}${suffix})" >&2; exit 1; }
            mkdir -p "$(dirname "$dest")"
            cp "$match" "$dest"
          done <<< "$README_IMAGES"

      - name: Check for changes
        id: diff
        run: |
          git add fastlane/metadata/android/en-US/images
          if [ "${{ inputs.sync-readme }}" = "true" ]; then
            git add $(printf '%s\n' "${{ inputs.readme-images }}" | cut -d'|' -f2 | xargs -r dirname | sort -u)
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Plain GITHUB_TOKEN may push anything except a ref update whose *newly introduced* commits
      # touch .github/workflows/* ("refusing to allow a GitHub App to create or update workflow
      # ... without `workflows` permission" - not grantable via `permissions:`). Force-pushing a
      # branch rebuilt from today's main over the previous run's branch introduces every workflow
      # change main picked up in between, which is why this used to need a PAT. So the branch
      # never moves across main's history:
      # - open PR: the fresh screenshots go on top of its existing branch, a fast-forward
      #   introducing one images-only commit;
      # - no open PR: a stale branch (from a merged/closed PR) is deleted and the branch is
      #   created fresh from main - a new ref only introduces the one screenshot commit, the rest
      #   is already in the repository.
      - name: Commit and push
        if: ${{ steps.diff.outputs.changed == 'true' }}
        id: commit
        env:
          COMMIT_MESSAGE: ${{ inputs.commit-message }}
          GH_TOKEN: ${{ github.token }}
          SYNC_README: ${{ inputs.sync-readme }}
          README_IMAGES: ${{ inputs.readme-images }}
        run: |
          set -euo pipefail
          branch="screenshots/update"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          paths=(fastlane/metadata/android/en-US/images)
          if [ "$SYNC_README" = "true" ]; then
            while IFS= read -r dir; do
              [ -n "$dir" ] && paths+=("$dir")
            done < <(printf '%s\n' "$README_IMAGES" | cut -d'|' -f2 | xargs -r -n1 dirname | sort -u)
          fi

          open_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ] && git fetch --quiet --depth=1 origin "$branch"; then
            # Move the freshly captured files over onto the PR branch's own tree.
            snapshot="$(mktemp)"
            tar -cf "$snapshot" "${paths[@]}"
            git reset --quiet --hard HEAD
            git clean -fdq -- "${paths[@]}"
            git checkout --quiet -B "$branch" FETCH_HEAD
            rm -rf "${paths[@]}"
            tar -xf "$snapshot"
            git add -A -- "${paths[@]}"
            if git diff --cached --quiet; then
              echo "Screenshots identical to PR #$open_pr's branch - nothing to push"
              echo "pushed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit --quiet -m "$COMMIT_MESSAGE"
            git push origin "$branch"
          else
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              git push origin --delete "$branch"
            fi
            git checkout --quiet -B "$branch"
            git commit --quiet -m "$COMMIT_MESSAGE"
            git push origin "$branch"
          fi
          {
            echo "pushed=true"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # The PR diff is just-renamed binary PNGs, next to unreviewable without opening every file -
      # embed each one inline instead, addressed at this exact commit (not the branch, which gets
      # force-pushed again on the next run) so a comment's images never silently change under a
      # reviewer after the fact.
      - name: Build inline image gallery
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        id: gallery
        run: |
          sha="${{ steps.commit.outputs.sha }}"
          gallery_file="$(mktemp)"
          for device_type in phone sevenInch tenInch; do
            dir="fastlane/metadata/android/en-US/images/${device_type}Screenshots"
            shopt -s nullglob
            files=("$dir"/*.png)
            [ ${#files[@]} -eq 0 ] && continue
            {
              echo "<details open>"
              echo "<summary><strong>${device_type}</strong> (${#files[@]} images)</summary>"
              echo
              for f in "${files[@]}"; do
                name="$(basename "$f")"
                url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${sha}/${f}"
                printf '<img src="%s" width="200" alt="%s" title="%s">\n' "$url" "$name" "$name"
              done
              echo
              echo "</details>"
              echo
            } >> "$gallery_file"
          done
          echo "path=$gallery_file" >> "$GITHUB_OUTPUT"

      # Creating the PR with GITHUB_TOKEN needs the repo's "Allow GitHub Actions to create and
      # approve pull requests" setting (Settings > Actions > General). Note PRs opened this way
      # don't trigger other workflows - fine for an images-only change.
      - name: Open or update the PR
        if: ${{ steps.commit.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          GALLERY_FILE: ${{ steps.gallery.outputs.path }}
          PR_BODY_INTRO: ${{ inputs.pr-body-intro }}
        run: |
          existing_pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          if [ -n "$existing_pr" ]; then
            {
              echo "Updated with fresh screenshots from run ${{ github.run_id }}."
              echo
              cat "$GALLERY_FILE"
            } > "$body_file"
            gh pr comment "$existing_pr" --body-file "$body_file"
          else
            {
              echo "Automated screenshot refresh from the \`Screenshots\` workflow (run ${{ github.run_id }}). Review the images below before merging.${PR_BODY_INTRO:+ $PR_BODY_INTRO}"
              echo
              echo "Re-running this workflow with \`open_pr\` updates this same PR instead of opening a new one."
              echo
              cat "$GALLERY_FILE"
            } > "$body_file"
            gh pr create --title "Update screenshots" --body-file "$body_file" --head "$BRANCH" --base "${{ github.ref_name }}"
          fi
