name: Reusable / Release

# One pipeline, two release flavors depending on what got pushed:
# - a push to main moves the rolling "latest" prerelease tag and republishes it (debug + release
#   APKs, always prerelease, never the repo's "Latest release" badge)
# - a push of a semantic-version tag ("vX.Y.Z" or "X.Y.Z") publishes a real, permanent release at
#   that tag (release APKs only, becomes the repo's "Latest release")
# Both need the identical build/sign/verify/checksum pipeline, so it's one job with a branch
# partway through rather than two workflows that would only drift apart over time.
#
# Callers need these repo secrets to produce a *signed* release (enable-release-signing: true,
# the default): CI_KEYSTORE_BASE64, CI_KEYSTORE_PASSWORD, CI_KEY_ALIAS, CI_KEY_PASSWORD. With
# enable-release-signing: false, the release build falls back to whatever signing config the
# app's own build.gradle.kts defines.

on:
  workflow_call:
    inputs:
      app-display-name:
        description: Human-readable app name for release notes/body text, e.g. "Nyetbox"
        type: string
        required: true
      application-id:
        description: Release applicationId, e.g. dev.pschmitt.nyetbox (the debug build uses <application-id>.debug)
        type: string
        required: true
      artifact-label:
        description: Filename/branch-safe slug used to prefix release asset names, e.g. "nyetbox"
        type: string
        required: true
      java-version:
        type: string
        default: '21.0.11'
      enable-release-signing:
        description: Decode CI_KEYSTORE_BASE64 and sign the release build with it
        type: boolean
        default: true
      keystore-file-name:
        description: On-disk filename for the decoded keystore
        type: string
        default: ''
      gradle-debug-task:
        type: string
        default: assembleDebug
      gradle-release-task:
        type: string
        default: assembleRelease
      release-apk-paths:
        description: Newline-separated list of built release APK paths
        type: string
        default: |
          app/build/outputs/apk/release/app-arm64-v8a-release.apk
          app/build/outputs/apk/release/app-armeabi-v7a-release.apk
          app/build/outputs/apk/release/app-x86_64-release.apk
          app/build/outputs/apk/release/app-x86-release.apk
      debug-apk-paths:
        description: Newline-separated list of built debug APK paths (only used for the rolling "latest" prerelease)
        type: string
        default: |
          app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          app/build/outputs/apk/debug/app-x86_64-debug.apk
          app/build/outputs/apk/debug/app-x86-debug.apk
      apk-rename-sed:
        description: Optional sed -E expression applied to each APK's basename before it's copied into the release dir (e.g. to collapse a multi-module prefix)
        type: string
        default: ''
      compute-version-name:
        description: Derive a version name from `git describe` and pass it as -PversionName=<name> to the release build
        type: boolean
        default: false
      trigger-screenshots:
        description: Dispatch screenshots.yaml (with open_pr=true) after publishing a real tagged release
        type: boolean
        default: true
      vacuum-stale-assets:
        description: Delete release assets on the rolling "latest" tag that this run didn't (re)upload
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  # For actions/attest-build-provenance: id-token to mint the OIDC token needed for a Sigstore
  # signing certificate, attestations to persist the resulting attestation against the repo.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pschmitt/android-app-ci/.github/actions/setup-jdk-gradle@main
        with:
          java-version: ${{ inputs.java-version }}

      - name: Decode CI signing keystore
        id: ci_keystore
        if: inputs.enable-release-signing
        uses: pschmitt/android-app-ci/.github/actions/decode-ci-keystore@main
        with:
          keystore-base64: ${{ secrets.CI_KEYSTORE_BASE64 }}
          file-name: ${{ inputs.keystore-file-name != '' && inputs.keystore-file-name || format('{0}-ci.jks', inputs.artifact-label) }}

      - name: Determine release parameters
        # A pushed semantic-version tag gets its own permanent release; anything else (a main push,
        # or a manual dispatch off main) republishes the rolling "latest" prerelease instead.
        id: params
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            {
              echo "tag_name=${{ github.ref_name }}"
              echo "release_name=${{ github.ref_name }}"
              echo "include_debug=false"
              echo "move_tag=false"
              echo "vacuum_stale_assets=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tag_name=latest"
              echo "release_name=Latest build"
              echo "include_debug=true"
              echo "move_tag=true"
              echo "vacuum_stale_assets=${{ inputs.vacuum-stale-assets }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Compute git revision
        id: git_revision
        run: echo "value=$(git describe --always --abbrev=12 --dirty --exclude=latest)" >> "$GITHUB_OUTPUT"

      - name: Resolve Android version name
        id: version
        if: inputs.compute-version-name
        env:
          REVISION: ${{ steps.git_revision.outputs.value }}
        run: |
          if [[ "$REVISION" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+)([-+].*)?$ ]]; then
            version_name="${BASH_REMATCH[1]}"
          else
            version_name="0.1.0"
          fi
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Generate release summary
        if: steps.params.outputs.tag_name != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          APP_DISPLAY_NAME: ${{ inputs.app-display-name }}
          APPLICATION_ID: ${{ inputs.application-id }}
        run: |
          set -euo pipefail

          previous_tag=""
          while IFS= read -r candidate
          do
            if [[ "$candidate" != latest && "$candidate" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]
            then
              previous_tag="$candidate"
              break
            fi
          done < <(git tag --merged "${GITHUB_SHA}^" --sort=-version:refname)
          if [[ -n "$previous_tag" ]]
          then
            release_range="$previous_tag..$GITHUB_SHA"
          else
            release_range="$GITHUB_SHA"
          fi

          generated_notes="$(mktemp)"
          trap 'rm -f "$generated_notes"' EXIT
          api_args=(
            --method POST
            "repos/$GITHUB_REPOSITORY/releases/generate-notes"
            -f "tag_name=${{ steps.params.outputs.tag_name }}"
            -f "target_commitish=$GITHUB_SHA"
          )
          if [[ -n "$previous_tag" ]]
          then
            api_args+=(-f "previous_tag_name=$previous_tag")
          fi

          if ! gh api "${api_args[@]}" --jq '.body' > "$generated_notes"
          then
            : > "$generated_notes"
          fi

          {
            echo "# $APP_DISPLAY_NAME ${{ steps.params.outputs.release_name }}"
            echo
            if [[ -n "$previous_tag" ]]
            then
              echo "Changes since [$previous_tag](https://github.com/$GITHUB_REPOSITORY/releases/tag/$previous_tag):"
            else
              echo "Changes included in this release:"
            fi
            echo
            echo "## Summary"
            echo
            git log --no-merges --format='- %s (%h)' "$release_range"
            echo
            if [[ -s "$generated_notes" ]]
            then
              echo "## GitHub details"
              echo
              cat "$generated_notes"
              echo
            fi
            echo "## Installation"
            echo
            if [[ "${{ inputs.enable-release-signing }}" == "true" ]]; then
              echo "Signed with the same CI key as every other build here, so upgrades work cleanly over"
              echo "an existing \`$APPLICATION_ID\` install."
            else
              echo "Upgrades cleanly over an existing \`$APPLICATION_ID\` install."
            fi
            echo
            printf '%s\n' "\`SHA256SUMS\` covers every APK. Each APK embeds commit \`$GITHUB_SHA\`, visible in"
            echo "Settings > About."
          } > release-notes.md

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build APKs
        run: >
          ./gradlew
          ${{ steps.params.outputs.include_debug == 'true' && inputs.gradle-debug-task || '' }}
          ${{ inputs.gradle-release-task }}
          ${{ inputs.compute-version-name && format('-PversionName={0}', steps.version.outputs.name) || '' }}
          --stacktrace --build-cache
        env:
          CI_KEYSTORE_PATH: ${{ inputs.enable-release-signing && steps.ci_keystore.outputs.path || '' }}
          CI_KEYSTORE_PASSWORD: ${{ inputs.enable-release-signing && secrets.CI_KEYSTORE_PASSWORD || '' }}
          CI_KEY_ALIAS: ${{ inputs.enable-release-signing && secrets.CI_KEY_ALIAS || '' }}
          CI_KEY_PASSWORD: ${{ inputs.enable-release-signing && secrets.CI_KEY_PASSWORD || '' }}
          GIT_REVISION: ${{ steps.git_revision.outputs.value }}

      - name: Verify embedded Android version name
        if: inputs.compute-version-name
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.name }}
        run: |
          aapt2_path="$(ls -1d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n1)"
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            actual_version="$($aapt2_path dump badging "$apk" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p")"
            if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
              echo "::error::$apk: expected Android version $EXPECTED_VERSION, got $actual_version" >&2
              exit 1
            fi
          done <<< "${{ inputs.release-apk-paths }}"

      - name: Verify embedded git revision
        # Confirms GIT_REVISION actually made it into every release artifact instead of silently
        # falling back to "unknown".
        env:
          REVISION: ${{ steps.git_revision.outputs.value }}
        run: |
          while IFS= read -r apk; do
            [ -n "$apk" ] || continue
            if ! unzip -p "$apk" 'classes*.dex' | strings | grep -Fx "$REVISION" >/dev/null; then
              echo "::error::$apk does not contain expected revision: $REVISION" >&2
              exit 1
            fi
          done <<< "${{ inputs.release-apk-paths }}"

      - name: Collect and rename APKs
        id: apks
        env:
          RENAME_SED: ${{ inputs.apk-rename-sed }}
        run: |
          label="${{ inputs.artifact-label }}-${{ steps.params.outputs.tag_name }}"
          dir="/tmp/$label"
          mkdir -p "$dir"

          apks=()
          while IFS= read -r apk; do
            [ -n "$apk" ] && apks+=("$apk")
          done <<< "${{ inputs.release-apk-paths }}"
          if [ "${{ steps.params.outputs.include_debug }}" = "true" ]; then
            while IFS= read -r apk; do
              [ -n "$apk" ] && apks+=("$apk")
            done <<< "${{ inputs.debug-apk-paths }}"
          fi

          for apk in "${apks[@]}"; do
            base="$(basename "$apk")"
            if [ -n "$RENAME_SED" ]; then
              base="$(printf '%s' "$base" | sed -E "$RENAME_SED")"
            fi
            cp "$apk" "$dir/$label-$base"
          done
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Generate checksums
        working-directory: ${{ steps.apks.outputs.dir }}
        run: sha256sum -- *.apk > SHA256SUMS

      - name: Attest build provenance
        # Signed SLSA build provenance for every APK, keyed off the checksums file just generated
        # rather than re-hashing each APK separately - one attestation covering every subject.
        # Runs for both the rolling "latest" prerelease and real tags: provenance is worth having
        # for whatever gets published, not only tagged releases. Verify with:
        #   gh attestation verify <apk> --repo ${{ github.repository }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: ${{ steps.apks.outputs.dir }}/SHA256SUMS

      - name: Move tag
        if: steps.params.outputs.move_tag == 'true'
        run: |
          git tag -f ${{ steps.params.outputs.tag_name }}
          git push origin ${{ steps.params.outputs.tag_name }} --force

      - name: Record build time
        if: steps.params.outputs.tag_name == 'latest'
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_OUTPUT"

      - name: Publish release (latest)
        if: steps.params.outputs.tag_name == 'latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest
          name: "Latest build"
          body: |
            Automated build of the latest main (${{ github.sha }}), built ${{ steps.date.outputs.date }}. Not a stable release.

            Two variants are provided, both signed with the same CI key so upgrades between them work:
            - `*-debug.apk` — debuggable, uses the `${{ inputs.application-id }}.debug` applicationId so it installs side by side with a release install for testing.
            - `*-release.apk` — minified/optimized like a real release build, uses the same `${{ inputs.application-id }}` applicationId as every tagged release, so it upgrades cleanly over (or is upgraded by) any of them.

            `SHA256SUMS` covers every APK above. Each APK also embeds this exact commit
            (`${{ github.sha }}`) as `BuildConfig.GIT_REVISION`, checkable via Settings in the app.
          files: ${{ steps.apks.outputs.dir }}/*
          prerelease: true
          make_latest: false

      - name: Publish release (tag)
        if: steps.params.outputs.tag_name != 'latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.params.outputs.tag_name }}
          name: ${{ steps.params.outputs.release_name }}
          body_path: release-notes.md
          files: ${{ steps.apks.outputs.dir }}/*
          prerelease: false
          make_latest: true

      - name: Trigger screenshot capture
        # A real tagged release is the natural cue to refresh Play Store screenshots - the rolling
        # "latest" prerelease republishes on every main push, far too often for a long-running
        # multi-device emulator job, so this only fires for a real version tag. workflow_dispatch
        # is one of the two events (alongside repository_dispatch) explicitly exempted from
        # "GITHUB_TOKEN-caused events don't trigger new workflow runs", so the default token works
        # here - it just needs the `actions: write` permission declared above. open_pr=true so the
        # refreshed screenshots land as a reviewable PR (see screenshots.yaml) instead of only a
        # build artifact.
        if: inputs.trigger-screenshots && steps.params.outputs.tag_name != 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run screenshots.yaml --repo "$GITHUB_REPOSITORY" --ref main -f open_pr=true

      - name: Vacuum stale release assets
        if: steps.params.outputs.vacuum_stale_assets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t expected < <(basename -a "${{ steps.apks.outputs.dir }}"/*)
          gh release view ${{ steps.params.outputs.tag_name }} --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r name; do
              keep=0
              for f in "${expected[@]}"; do
                [ "$name" = "$f" ] && keep=1 && break
              done
              if [ "$keep" -eq 0 ]; then
                echo "Deleting stale asset: $name"
                gh release delete-asset ${{ steps.params.outputs.tag_name }} "$name" --repo "$GITHUB_REPOSITORY" -y
              fi
            done
